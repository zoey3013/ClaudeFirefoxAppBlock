<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchor — Settings</title>
  <link rel="icon" href="../../icons/icon.svg">
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="../../icons/icon.svg" alt="" width="26" height="26"> Anchor</div>

      <p class="label" data-i18n="focusGroups">Focus groups</p>
      <nav class="nav" id="groupNav"></nav>
      <button class="btn ghost new" id="newGroup" data-i18n="newGroup">+ New group</button>

      <p class="label" data-i18n="insights">Insights</p>
      <nav class="nav">
        <button class="nav-item" id="navStats"><span class="icon">▥</span><span class="meta"><span class="name" data-i18n="stats">Stats</span></span></button>
      </nav>

      <p class="label" data-i18n="preferences">Preferences</p>
      <nav class="nav">
        <button class="nav-item" id="navGeneral"><span class="icon">⚙</span><span class="meta"><span class="name" data-i18n="general">General</span></span></button>
      </nav>

      <div class="side-note" id="privateNote" hidden><strong data-i18n="privateTitle"></strong> <span data-i18n="privateSteps"></span></div>
    </aside>

    <main class="main">
      <div class="banner" id="permBanner" hidden>
        <span data-i18n="permBanner"></span>
        <button class="btn small primary" id="grant" data-i18n="allowAccess">Allow access</button>
      </div>
      <section id="editor"></section>
      <section id="stats" hidden></section>
      <section id="general" hidden></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="../i18n.js"></script>
  <script src="../core.js"></script>
  <script src="../ui/challenge.js"></script>
  <script src="stats.js"></script>
  <script src="options.js"></script>
</body>
</html>
