<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="../../icons/icon.svg" alt="" width="22" height="22"> Anchor</div>
    <div>
      <button class="btn ghost small" id="openStats" title="Stats">Stats</button>
      <button class="btn ghost small" id="openSettings" title="Settings">Settings</button>
    </div>
  </header>

  <div class="banner" id="permBanner" hidden>
    Anchor needs access to websites to block them.
    <button class="btn small primary" id="grant">Allow</button>
  </div>

  <section class="card current" id="current">
    <p class="faint label">This site</p>
    <p class="host" id="host">—</p>
    <div id="currentStatus" class="current-status"></div>
    <form class="add" id="addForm" hidden>
      <select class="input" id="addGroup" aria-label="Group"></select>
      <button class="btn primary" type="submit">Block</button>
    </form>
  </section>

  <section>
    <p class="faint label pad">Focus groups</p>
    <ul class="groups" id="groups"></ul>
    <p class="empty muted" id="empty" hidden>No groups yet. Create one in Settings.</p>
  </section>

  <script src="../core.js"></script>
  <script src="../ui/challenge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
