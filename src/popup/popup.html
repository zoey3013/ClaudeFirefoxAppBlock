<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="../../icons/icon.svg" alt="" width="22" height="22"> Anchor</div>
    <div>
      <button class="btn ghost small" id="openStats" data-i18n="stats">Stats</button>
      <button class="btn ghost small" id="openSettings" data-i18n="settings">Settings</button>
    </div>
  </header>

  <div class="banner" id="permBanner" hidden>
    <span data-i18n="permNeeded"></span>
    <button class="btn small primary" id="grant" data-i18n="allow">Allow</button>
  </div>

  <section class="card current" id="current">
    <p class="faint label" data-i18n="thisSite">This site</p>
    <p class="host" id="host">—</p>
    <div id="currentStatus" class="current-status"></div>
    <form class="add" id="addForm" hidden>
      <select class="input" id="addGroup" data-i18n-aria="groupName"></select>
      <button class="btn primary" type="submit" data-i18n="block">Block</button>
    </form>
  </section>

  <section>
    <p class="faint label pad" data-i18n="focusGroups">Focus groups</p>
    <ul class="groups" id="groups"></ul>
    <p class="empty muted" id="empty" hidden data-i18n="noGroupsPopup"></p>
  </section>

  <script src="../i18n.js"></script>
  <script src="../core.js"></script>
  <script src="../ui/challenge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
